<header class="sticky top-0 z-40 border-b border-[var(--border)] bg-[var(--background)]">
	<div class="container-x flex flex-wrap items-center justify-between gap-x-6 gap-y-1 py-2 md:flex-nowrap">
		<a
			class="ds-plain inline-flex items-center gap-3 rounded-[var(--radius-md)]"
			routerLink="/"
			[attr.aria-label]="'Go to homepage' | tr"
		>
			<img
				class="h-9 w-9 rounded-full"
				ngSrc="logo.png"
				width="72"
				height="72"
				priority
				[alt]="'Project logo' | tr"
			/>
			<span class="hidden text-base font-semibold tracking-[-0.01em] sm:inline">{{ company().name }}</span>
		</a>

		<nav
			class="order-last -mx-3 flex w-full items-center gap-1 md:order-none md:mx-0 md:mr-auto md:w-auto"
			[attr.aria-label]="'Main navigation' | tr"
		>
			@for (link of links; track link.path) {
				<a
					class="nav-link"
					ariaCurrentWhenActive="page"
					routerLinkActive
					[routerLink]="link.path"
				>
					{{ link.label | tr }}
				</a>
			}
		</nav>

		<div class="flex items-center gap-1">
			<a
				class="ds-btn ds-btn-ghost ds-btn-icon"
				[href]="githubUrl"
				rel="noopener"
				target="_blank"
				[attr.aria-label]="'IT-Kamianets on GitHub' | tr"
			>
				<app-icon name="git-branch" />
			</a>
			<button
				class="ds-btn ds-btn-ghost gap-2 px-2"
				type="button"
				[attr.aria-label]="languageLabel()"
				(click)="switchLanguage()"
			>
				<img
					class="h-[18px] w-6 rounded-[3px] object-cover"
					[alt]="''"
					[ngSrc]="currentLanguage().flagSrc"
					width="24"
					height="18"
				/>
				<span class="ds-mono uppercase">{{ currentLanguage().code }}</span>
			</button>
			<button
				class="ds-btn ds-btn-ghost ds-btn-icon"
				type="button"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
			>
				<app-icon [name]="mode() === 'dark' ? 'sun' : 'moon'" />
			</button>
		</div>
	</div>
</header>
