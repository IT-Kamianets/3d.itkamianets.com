<footer class="mt-24 border-t border-[var(--border)]">
	<div class="container-x grid gap-10 py-12 md:grid-cols-[minmax(0,1.5fr)_minmax(0,1fr)_minmax(0,1fr)]">
		<div>
			<p class="text-base font-semibold">{{ company().name }}</p>
			<p class="ds-supporting mt-2 max-w-[44ch]">{{ companyDescription() }}</p>
		</div>

		<nav [translate]="{ ariaLabel: 'Pages footer navigation' }">
			<p class="ds-supporting" translate>Pages</p>
			<ul class="mt-3 flex list-none flex-col gap-2 p-0">
				@for (page of pageLinks; track page.path) {
					<li>
						<a [routerLink]="page.path" [translate]="page.label">{{ page.label }}</a>
					</li>
				}
			</ul>
		</nav>

		<div>
			<p class="ds-supporting" translate>Source</p>
			<ul class="mt-3 flex list-none flex-col gap-2 p-0">
				<li><a [href]="githubUrl" rel="noopener" target="_blank">GitHub</a></li>
			</ul>
		</div>
	</div>

	<div class="border-t border-[var(--border)]">
		<p class="container-x ds-supporting py-5">
			&copy; {{ currentYear }} {{ company().name }}. <span translate>All rights reserved.</span>
		</p>
	</div>
</footer>
