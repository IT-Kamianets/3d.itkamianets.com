<div class="ds-card overflow-x-auto p-5">
	<svg
		class="block min-w-[44rem]"
		[attr.viewBox]="'0 0 ' + width + ' ' + height"
		role="group"
		[attr.aria-label]="'Package dependency graph. ' + summary + '.'"
	>
		@for (edge of edges; track edge.id) {
			<path [attr.d]="edge.path" fill="none" stroke="var(--muted-foreground)" stroke-opacity="0.7" stroke-width="1.5" />
		}
		@for (item of nodes; track item.slug) {
			<a [attr.href]="'/packages/' + item.slug" (click)="$event.preventDefault(); open(item.slug)">
				<rect
					[attr.x]="item.x"
					[attr.y]="item.y"
					[attr.width]="node.width"
					[attr.height]="node.height"
					rx="8"
					fill="var(--secondary)"
					stroke="var(--border)"
				/>
				<text
					[attr.x]="item.x + node.width / 2"
					[attr.y]="item.y + node.height / 2"
					text-anchor="middle"
					dominant-baseline="central"
					fill="var(--foreground)"
					style="font-family: var(--font-mono); font-size: 14px"
				>
					{{ item.name }}
				</text>
			</a>
		}
	</svg>
</div>
