<figure class="m-0">
	<div class="relative w-full" [style.aspect-ratio]="view.width + ' / ' + view.height">
		<svg
			class="absolute inset-0 h-full w-full"
			[attr.viewBox]="'0 0 ' + view.width + ' ' + view.height"
			role="img"
			[attr.aria-label]="'A scanned room drawn as a wireframe. The floor, a wall, a door and a window are tagged with the semantic labels of the scene schema.' | tr"
		>
			<polygon [attr.points]="floor" fill="var(--figure)" fill-opacity="0.07" />
			@for (line of gridLines; track $index) {
				<line
					[attr.x1]="line.from[0]"
					[attr.y1]="line.from[1]"
					[attr.x2]="line.to[0]"
					[attr.y2]="line.to[1]"
					stroke="var(--figure)"
					stroke-opacity="0.16"
					stroke-width="1"
				/>
			}
			<polygon [attr.points]="leftWall" fill="var(--figure)" fill-opacity="0.04" />
			<polygon [attr.points]="rightWall" fill="var(--figure)" fill-opacity="0.06" />
			<g fill="none" stroke="var(--figure)" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round">
				<polygon [attr.points]="floor" />
				<polygon [attr.points]="leftWall" />
				<polygon [attr.points]="rightWall" />
			</g>
			<g fill="var(--figure)" fill-opacity="0.22" stroke="var(--figure)" stroke-width="2" stroke-linejoin="round">
				<polygon [attr.points]="door" />
				<polygon [attr.points]="window" />
			</g>
			@for (item of tags; track item.label) {
				<line
					[attr.x1]="item.anchor[0]"
					[attr.y1]="item.anchor[1]"
					[attr.x2]="item.join[0]"
					[attr.y2]="item.join[1]"
					stroke="var(--muted-foreground)"
					stroke-width="1"
				/>
				<circle [attr.cx]="item.anchor[0]" [attr.cy]="item.anchor[1]" r="8" fill="var(--figure)" fill-opacity="0.25" />
				<circle [attr.cx]="item.anchor[0]" [attr.cy]="item.anchor[1]" r="3.5" fill="var(--figure)" />
			}
		</svg>

		<!-- Chips are HTML so the text stays readable when the drawing scales down. -->
		@for (item of tags; track item.label) {
			<span
				class="ds-kbd absolute hidden items-center justify-center whitespace-nowrap sm:inline-flex"
				[style.left]="left(item.chip.x)"
				[style.top]="top(item.chip.y)"
				[style.width]="left(chipSize.width)"
				[style.height]="top(chipSize.height)"
				aria-hidden="true"
			>
				{{ item.label }}
			</span>
		}
	</div>

	<ul class="mt-3 flex flex-wrap gap-2 p-0 sm:hidden" style="list-style: none" aria-hidden="true">
		@for (label of labels; track label) {
			<li class="ds-kbd">{{ label }}</li>
		}
	</ul>
</figure>
